name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v1.0.6)'
        required: false
        default: 'v1.0.6'

permissions:
  contents: write

env:
  VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.6' }}

jobs:
  build-android:
    name: Android & Android TV (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Universal, Split-ABI APKs & AppBundle
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          flutter build apk --split-per-abi --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LiuguangVideo-Android-Universal-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LiuguangVideo-AndroidTV-Universal-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/LiuguangVideo-Android-arm64-v8a-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/LiuguangVideo-Android-armeabi-v7a-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/LiuguangVideo-Android-x86_64-${VERSION_TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/LiuguangVideo-Android-Release-${VERSION_TAG}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/*.aab

  build-macos-ios:
    name: macOS (.dmg/.zip) & iOS (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build macOS DMG & ZIP
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build macos --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/LiuguangVideo-macOS-universal-${VERSION_TAG}.zip"
          DMG_STAGE="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGE/流光视频.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "流光视频 ${VERSION_TAG}" -srcfolder "$DMG_STAGE" -ov -format UDZO "dist/LiuguangVideo-macOS-universal-${VERSION_TAG}.dmg"
      - name: Build iOS Unsigned IPA
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          IPA_STAGE="$(mktemp -d)"
          mkdir -p "$IPA_STAGE/Payload"
          cp -R build/ios/iphoneos/Runner.app "$IPA_STAGE/Payload/Runner.app"
          (cd "$IPA_STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/LiuguangVideo-iOS-${VERSION_TAG}-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: apple-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.ipa

  build-windows:
    name: Windows x64 (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Windows Release
        shell: bash
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build windows --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/LiuguangVideo-Windows-x64-${VERSION_TAG}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  build-linux:
    name: Linux x64 (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Desktop & MPV Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Linux Release
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          tar -czf "dist/LiuguangVideo-Linux-x64-${VERSION_TAG}.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos-ios, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "流光视频 (LiuguangVideo) ${{ env.VERSION_TAG }}"
          files: release-assets/*
          generate_release_notes: true
