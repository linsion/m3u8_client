name: Release All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag version (e.g. v1.3.5)'
        required: false
        default: 'v1.3.5'

permissions:
  contents: write

env:
  VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.3.5' }}

jobs:
  build-android:
    name: Android & Android TV (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Configure Gradle Maven Central Mirror & Build Android Artifacts
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/maven-central.init.gradle.kts
          beforeSettings {
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          settingsEvaluated {
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          EOF
          FLUTTER_GRADLE_SETTINGS="$(dirname $(dirname $(which flutter)))/packages/flutter_tools/gradle/settings.gradle.kts"
          if [ -f "$FLUTTER_GRADLE_SETTINGS" ] && ! grep -q "pluginManagement" "$FLUTTER_GRADLE_SETTINGS"; then
            TMP_SETTINGS="$(mktemp)"
            cat << 'EOF' > "$TMP_SETTINGS"
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
            cat "$FLUTTER_GRADLE_SETTINGS" >> "$TMP_SETTINGS"
            cp "$TMP_SETTINGS" "$FLUTTER_GRADLE_SETTINGS"
          fi
          flutter pub get
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          (cd android && ./gradlew --stop || true)
          flutter build apk --split-per-abi --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          (cd android && ./gradlew --stop || true)
          flutter build appbundle --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LiuguangVideo-Android-Universal-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LiuguangVideo-AndroidTV-Universal-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/LiuguangVideo-Android-arm64-v8a-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/LiuguangVideo-Android-armeabi-v7a-${VERSION_TAG}.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/LiuguangVideo-Android-x86_64-${VERSION_TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/LiuguangVideo-Android-Release-${VERSION_TAG}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/*.aab

  build-macos-ios:
    name: macOS (.dmg/.zip) & iOS (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build macOS DMG & ZIP
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build macos --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/LiuguangVideo-macOS-universal-${VERSION_TAG}.zip"
          DMG_STAGE="$(mktemp -d)"
          cp -R "$APP_PATH" "$DMG_STAGE/流光视频.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "流光视频 ${VERSION_TAG}" -srcfolder "$DMG_STAGE" -ov -format UDZO "dist/LiuguangVideo-macOS-universal-${VERSION_TAG}.dmg"
      - name: Build iOS Unsigned IPA
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          IPA_STAGE="$(mktemp -d)"
          mkdir -p "$IPA_STAGE/Payload"
          cp -R build/ios/iphoneos/Runner.app "$IPA_STAGE/Payload/Runner.app"
          for fw in "$IPA_STAGE/Payload/Runner.app/Frameworks/"*.framework; do
            [ -d "$fw" ] && codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none "$IPA_STAGE/Payload/Runner.app"
          (cd "$IPA_STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/LiuguangVideo-iOS-${VERSION_TAG}-unsigned.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/LiuguangVideo-iOS-${VERSION_TAG}-unsigned.ipa" >/dev/null
      - name: Build Apple TV (tvOS) Unsigned IPA
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          TVOS_APP_PATH="$GITHUB_WORKSPACE/build/tvos/Build/Products/Release-appletvos/Runner.app"
          if ! xcodebuild -project tvos/Runner.xcodeproj -target Runner -sdk appletvos -configuration Release \
            MARKETING_VERSION="$BUILD_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            SYMROOT="$GITHUB_WORKSPACE/build/tvos/Build/Products" \
            OBJROOT="$GITHUB_WORKSPACE/build/tvos/Build/Intermediates.noindex" \
            CODE_SIGNING_ALLOWED=NO build; then
            TVOS_SDK_PATH="$(xcrun --sdk appletvos --show-sdk-path)"
            mkdir -p "$TVOS_APP_PATH"
            cp -f tvos/Runner/Assets.car tvos/Runner/AppIcon.png tvos/Runner/AppIcon@2x.png tvos/Runner/TopShelfWide.png tvos/Runner/TopShelfWide@2x.png "$TVOS_APP_PATH/" 2>/dev/null || true
            cp -f tvos/Runner/Info.plist "$TVOS_APP_PATH/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Runner" "$TVOS_APP_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.linsion.m3u8Client.tvos" "$TVOS_APP_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BUILD_NAME}" "$TVOS_APP_PATH/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "$TVOS_APP_PATH/Info.plist" || true
            printf "APPL????" > "$TVOS_APP_PATH/PkgInfo"
            xcrun --sdk appletvos swiftc \
              -O -whole-module-optimization \
              -sdk "$TVOS_SDK_PATH" \
              -target arm64-apple-tvos16.0 \
              -module-name Runner \
              -enable-bare-slash-regex \
              tvos/Runner/Models.swift \
              tvos/Runner/TvApiClient.swift \
              tvos/Runner/TvAppState.swift \
              tvos/Runner/TvPlayerView.swift \
              tvos/Runner/AppDelegate.swift \
              -o "$TVOS_APP_PATH/Runner"
          fi
          cp -f tvos/Runner/Assets.car tvos/Runner/AppIcon.png tvos/Runner/AppIcon@2x.png tvos/Runner/TopShelfWide.png tvos/Runner/TopShelfWide@2x.png "$TVOS_APP_PATH/" 2>/dev/null || true
          IPA_STAGE="$(mktemp -d)"
          mkdir -p "$IPA_STAGE/Payload"
          cp -R "$TVOS_APP_PATH" "$IPA_STAGE/Payload/Runner.app"
          codesign --force --sign - --timestamp=none "$IPA_STAGE/Payload/Runner.app"
          (cd "$IPA_STAGE" && zip -qry "$GITHUB_WORKSPACE/dist/LiuguangVideo-tvOS-${VERSION_TAG}-unsigned.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/dist/LiuguangVideo-tvOS-${VERSION_TAG}-unsigned.ipa" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: apple-release
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.ipa

  build-windows:
    name: Windows x64 (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Windows Release
        shell: bash
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build windows --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/dist/LiuguangVideo-Windows-x64-${VERSION_TAG}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  build-linux:
    name: Linux x64 (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Desktop & MPV Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Linux Release
        run: |
          BUILD_NAME="${VERSION_TAG#v}"
          BUILD_NUM=$((100 + GITHUB_RUN_NUMBER))
          flutter pub get
          flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUM"
          mkdir -p dist
          tar -czf "dist/LiuguangVideo-Linux-x64-${VERSION_TAG}.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos-ios, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "流光视频 (LiuguangVideo) ${{ env.VERSION_TAG }}"
          files: release-assets/*
          generate_release_notes: true
